<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>うみがめ 音声入力</title><style>body{margin:0;background:#f2f8f5;color:#153b32;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:680px;margin:auto;padding:30px}.box{background:#fff;padding:24px;border:1px solid #cce0d9;border-radius:18px;box-shadow:0 8px 24px #143b3212}h1{font-size:1.5rem;margin:0 0 8px}.hint{line-height:1.7;color:#526b64}button,textarea{box-sizing:border-box;width:100%;padding:15px;margin:8px 0;font:inherit;border-radius:10px}button{border:0;background:#08765e;color:#fff;font-weight:700;cursor:pointer}#stop{background:#e6f0ec;color:#164f43}textarea{height:150px;border:1px solid #aac6bd}.status{min-height:1.5em;font-weight:700;color:#08765e}.privacy{font-size:.85rem;color:#60766f}</style></head><body><main><div class="box"><h1>サービス提供実施記録簿｜音声入力</h1><p class="hint">話した内容はこの画面には保存されません。確認後、元の記録簿画面へ送ります。</p><button id="start">🎙 音声入力を開始</button><button id="stop" hidden>入力を終了</button><p id="status" class="status"></p><textarea id="text" placeholder="音声の文字起こしがここに表示されます。直接入力もできます。"></textarea><button id="send">内容を記録簿へ送る</button><p class="privacy">送信後は記録簿側で内容を確認してから保存します。</p></div></main><script>const $=x=>document.querySelector(x);let r;$('#start').onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){$('#status').textContent='Google Chrome または Microsoft Edge で開いてください。';return}r=new S();r.lang='ja-JP';r.continuous=true;r.interimResults=true;r.onresult=e=>$('#text').value=[...e.results].map(x=>x[0].transcript).join('');r.onerror=e=>{$('#status').textContent='音声入力エラー：'+e.error+'。マイクの許可を確認してください。';$('#start').hidden=false;$('#stop').hidden=true};r.onend=()=>{$('#start').hidden=false;$('#stop').hidden=true};r.start();$('#start').hidden=true;$('#stop').hidden=false;$('#status').textContent='聞き取り中です…'};$('#stop').onclick=()=>r&&r.stop();$('#send').onclick=()=>{const t=$('#text').value.trim();if(!t){$('#status').textContent='内容を入力してください。';return}if(!window.opener){$('#status').textContent='この画面は記録簿アプリから開いてください。';return}window.opener.postMessage({type:'umigame-voice-transcript',transcript:t},'*');$('#status').textContent='記録簿画面へ戻ります…';try{window.opener.focus()}catch(e){}setTimeout(()=>window.close(),500)}</script></body></html>
